<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ant Design Frontend Trial Demo</title>
    <link rel="stylesheet" href="../node_modules/antd/dist/reset.css" />
    <link rel="stylesheet" href="../node_modules/antd/dist/antd.css" />
    <style>
      :root {
        color-scheme: light;
        --page: #f5f7fb;
        --ink: #172033;
        --muted: #667085;
        --line: #e6eaf2;
      }

      body {
        margin: 0;
        min-width: 1180px;
        background: var(--page);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .demo-shell {
        min-height: 100vh;
      }

      .demo-sider {
        background: #111827 !important;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
      }

      .brand {
        height: 64px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px;
        color: #fff;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .brand-mark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #1677ff, #31c48d);
        font-weight: 800;
      }

      .brand strong {
        display: block;
        font-size: 15px;
        line-height: 1.1;
      }

      .brand span {
        color: rgba(255, 255, 255, 0.56);
        font-size: 12px;
      }

      .demo-header {
        height: 64px;
        padding: 0 28px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }

      .demo-title h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.4;
      }

      .demo-title p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .demo-content {
        padding: 22px 28px 32px;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(360px, 0.9fr);
        gap: 16px;
        margin-bottom: 16px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .metric-card {
        border-radius: 8px;
      }

      .metric-label {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }

      .metric-value {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 28px;
        font-weight: 760;
      }

      .metric-value span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }

      .section-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(380px, 0.9fr);
        gap: 16px;
        align-items: start;
      }

      .chat-panel {
        display: grid;
        gap: 12px;
      }

      .message {
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .message.user {
        background: #f0f7ff;
        border-color: #b8dcff;
      }

      .message-meta {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .message p {
        margin: 0;
        line-height: 1.75;
      }

      .agent-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .agent-step {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: #fff;
      }

      .agent-step strong {
        display: block;
        margin-bottom: 8px;
      }

      .dimension-list {
        display: grid;
        gap: 14px;
      }

      .dimension-row {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr) 48px;
        gap: 10px;
        align-items: center;
        font-size: 13px;
      }

      .timeline-note {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="../node_modules/dayjs/dayjs.min.js"></script>
    <script src="../node_modules/antd/dist/antd.min.js"></script>
    <script src="../node_modules/@ant-design/icons/dist/index.umd.min.js"></script>
    <script>
      const { createElement: h } = React;
      const {
        Avatar,
        Badge,
        Button,
        Card,
        Col,
        ConfigProvider,
        Descriptions,
        Divider,
        Flex,
        Layout,
        Menu,
        Progress,
        Row,
        Space,
        Statistic,
        Table,
        Tag,
        Timeline,
        Typography
      } = antd;
      const {
        ApartmentOutlined,
        BarChartOutlined,
        CheckCircleOutlined,
        ClockCircleOutlined,
        DashboardOutlined,
        FileTextOutlined,
        MessageOutlined,
        SafetyCertificateOutlined,
        UserOutlined
      } = icons;
      const { Header, Sider, Content } = Layout;
      const { Text } = Typography;

      const dimensionRows = [
        ["信息辨别", 74, "稳定"],
        ["交付切分", 68, "可评"],
        ["承诺边界", 82, "突出"],
        ["向上对齐", 71, "稳定"],
        ["压力表达", 64, "补证"]
      ];

      const traceRows = [
        {
          key: "1",
          node: "prepareTurn",
          agent: "System",
          status: "completed",
          cost: "18ms",
          reason: "载入会话、场景和黑板状态"
        },
        {
          key: "2",
          node: "director",
          agent: "Director",
          status: "completed",
          cost: "1.1s",
          reason: "选择 Leader 追问承诺边界"
        },
        {
          key: "3",
          node: "roleAgent",
          agent: "Leader",
          status: "completed",
          cost: "2.4s",
          reason: "生成压力追问，不暴露评分量规"
        },
        {
          key: "4",
          node: "persistTurn",
          agent: "System",
          status: "completed",
          cost: "42ms",
          reason: "写入消息、覆盖槽位和 trace"
        }
      ];

      function MetricCard({ label, value, suffix, trend }) {
        return h(
          Card,
          { className: "metric-card", bordered: false },
          h("div", { className: "metric-label" }, label),
          h("div", { className: "metric-value" }, value, h("span", null, suffix)),
          h(Text, { type: trend === "up" ? "success" : "secondary" }, trend === "up" ? "较上周 +8%" : "本轮稳定")
        );
      }

      function AgentStep({ title, icon, status, description }) {
        return h(
          "div",
          { className: "agent-step" },
          h(Space, null, icon, h("strong", null, title)),
          h(Tag, { color: status === "running" ? "processing" : "success" }, status === "running" ? "运行中" : "完成"),
          h("div", { className: "timeline-note" }, description)
        );
      }

      function App() {
        return h(
          ConfigProvider,
          {
            theme: {
              token: {
                colorPrimary: "#1677ff",
                colorSuccess: "#16a34a",
                borderRadius: 8,
                fontFamily:
                  "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              },
              components: {
                Card: { headerFontSize: 15 },
                Layout: { bodyBg: "#f5f7fb", siderBg: "#111827", headerBg: "#ffffff" }
              }
            }
          },
          h(
            Layout,
            { className: "demo-shell" },
            h(
              Sider,
              { className: "demo-sider", width: 248 },
              h(
                "div",
                { className: "brand" },
                h("div", { className: "brand-mark" }, "M"),
                h("div", null, h("strong", null, "多智能体测评"), h("span", null, "Ant Design 试改 Demo"))
              ),
              h(Menu, {
                theme: "dark",
                mode: "inline",
                selectedKeys: ["session"],
                items: [
                  { key: "dashboard", icon: h(DashboardOutlined), label: "总览" },
                  { key: "session", icon: h(MessageOutlined), label: "会话详情" },
                  { key: "trace", icon: h(ApartmentOutlined), label: "执行轨迹" },
                  { key: "report", icon: h(FileTextOutlined), label: "报告复盘" }
                ]
              })
            ),
            h(
              Layout,
              null,
              h(
                Header,
                { className: "demo-header" },
                h(
                  "div",
                  { className: "demo-title" },
                  h("h1", null, "会话详情试改版"),
                  h("p", null, "将现有后台详情页整理成更清晰的评估工作台")
                ),
                h(
                  Space,
                  null,
                  h(Badge, { status: "processing", text: "LangGraph Run" }),
                  h(Button, { type: "primary", icon: h(BarChartOutlined) }, "导出报告"),
                  h(Avatar, { icon: h(UserOutlined) })
                )
              ),
              h(
                Content,
                { className: "demo-content" },
                h(
                  "div",
                  { className: "hero-grid" },
                  h(
                    Card,
                    {
                      title: "当前测评会话",
                      extra: h(Space, null, h(Tag, { color: "blue" }, "测验赛道"), h(Tag, { color: "green" }, "已完成"))
                    },
                    h(Descriptions, {
                      column: 2,
                      size: "small",
                      items: [
                        { key: "scene", label: "场景", children: "Q3 汇报前的设计稿缺口" },
                        { key: "round", label: "轮次", children: "8 / 8" },
                        { key: "model", label: "模型", children: "DeepSeek Flash + 评分思考" },
                        { key: "time", label: "用时", children: "240 秒自动结束" }
                      ]
                    }),
                    h(Divider),
                    h(
                      "div",
                      { className: "agent-strip" },
                      h(AgentStep, {
                        title: "Director",
                        icon: h(ApartmentOutlined),
                        status: "done",
                        description: "判断下一位角色和追问目标"
                      }),
                      h(AgentStep, {
                        title: "Guardrail",
                        icon: h(SafetyCertificateOutlined),
                        status: "done",
                        description: "过滤低质量回复和泄露风险"
                      }),
                      h(AgentStep, {
                        title: "Leader Agent",
                        icon: h(MessageOutlined),
                        status: "done",
                        description: "围绕边界和责任继续施压"
                      }),
                      h(AgentStep, {
                        title: "Judge",
                        icon: h(CheckCircleOutlined),
                        status: "running",
                        description: "采样评分并汇总方差"
                      })
                    )
                  ),
                  h(
                    Card,
                    { title: "维度证据覆盖", bordered: false },
                    h(
                      Row,
                      { gutter: 12 },
                      h(Col, { span: 12 }, h(Statistic, { title: "总分", value: 116, suffix: "/160" })),
                      h(Col, { span: 12 }, h(Statistic, { title: "证据槽位", value: 13, suffix: "/16" }))
                    ),
                    h(Divider),
                    h(
                      "div",
                      { className: "dimension-list" },
                      ...dimensionRows.map(([name, score, note]) =>
                        h(
                          "div",
                          { className: "dimension-row", key: name },
                          h("span", null, name),
                          h(Progress, { percent: score, showInfo: false, strokeColor: score > 75 ? "#16a34a" : "#1677ff" }),
                          h(Tag, { color: score > 75 ? "green" : "blue" }, note)
                        )
                      )
                    )
                  )
                ),
                h(
                  "div",
                  { className: "section-grid" },
                  h(
                    Card,
                    { title: "对话记录", bordered: false },
                    h(
                      "div",
                      { className: "chat-panel" },
                      h(
                        "div",
                        { className: "message" },
                        h("div", { className: "message-meta" }, h("span", null, "陈总 · VP"), h("span", null, "Leader Agent")),
                        h("p", null, "哪些数据你亲自核实过？三页设计缺的情况下，你准备找苏姐还是小秋？边界和截止时间是什么？")
                      ),
                      h(
                        "div",
                        { className: "message user" },
                        h("div", { className: "message-meta" }, h("span", null, "受试者"), h("span", null, "第 7 轮")),
                        h("p", null, "我会先把确认数据和假设数据分开，三页设计改成可汇报的低保真版本，苏姐只负责关键图表审核，小秋按模板补齐样式。下午 3 点前给陈总第一版，3 点 30 确认风险说明。")
                      ),
                      h(
                        "div",
                        { className: "message" },
                        h("div", { className: "message-meta" }, h("span", null, "Director"), h("span", null, "内部摘要")),
                        h("p", null, "本轮覆盖信息辨别、交付切分、承诺边界和向上对齐。下一步进入收束判断。")
                      )
                    )
                  ),
                  h(
                    Card,
                    { title: "Graph Timeline", bordered: false },
                    h(Timeline, {
                      items: [
                        {
                          color: "green",
                          children: h("div", null, h("strong", null, "prepareTurn"), h("div", { className: "timeline-note" }, "载入 session、scenario、blackboard"))
                        },
                        {
                          color: "blue",
                          children: h("div", null, h("strong", null, "director handoff"), h("div", { className: "timeline-note" }, "Director -> Leader，原因：补充边界证据"))
                        },
                        {
                          color: "green",
                          children: h("div", null, h("strong", null, "roleAgent"), h("div", { className: "timeline-note" }, "生成角色追问，未读取评分 rubric"))
                        },
                        {
                          dot: h(ClockCircleOutlined),
                          color: "blue",
                          children: h("div", null, h("strong", null, "judge sampling"), h("div", { className: "timeline-note" }, "采样评分中，正在计算维度均值和报告状态"))
                        }
                      ]
                    }),
                    h(Table, {
                      size: "small",
                      pagination: false,
                      dataSource: traceRows,
                      columns: [
                        { title: "节点", dataIndex: "node", key: "node" },
                        { title: "Agent", dataIndex: "agent", key: "agent" },
                        {
                          title: "状态",
                          dataIndex: "status",
                          key: "status",
                          render: (value) => h(Tag, { color: value === "completed" ? "green" : "blue" }, value)
                        },
                        { title: "耗时", dataIndex: "cost", key: "cost" },
                        { title: "说明", dataIndex: "reason", key: "reason" }
                      ]
                    })
                  )
                )
              )
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
